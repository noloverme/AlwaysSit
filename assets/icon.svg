<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#242638"/>
      <stop offset="55%" stop-color="#16161E"/>
      <stop offset="100%" stop-color="#0D0E14"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Vibrant Arrow Energy Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F7768E"/>
      <stop offset="35%" stop-color="#A78BFA"/>
      <stop offset="75%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0D7FE"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#FF9E64"/>
      <stop offset="100%" stop-color="#E0AF68"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="18" y="18" width="476" height="476" rx="108" ry="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4.5"/>
  <rect x="25" y="25" width="462" height="462" rx="101" ry="101" fill="none" stroke="#7AA2F7" stroke-width="1.5" opacity="0.3"/>

  <!-- Speed Motion Trails (Upward Thrust) -->
  <g opacity="0.45" stroke-linecap="round">
    <line x1="190" y1="360" x2="190" y2="280" stroke="#F7768E" stroke-width="5" stroke-dasharray="14 12"/>
    <line x1="322" y1="360" x2="322" y2="280" stroke="#F7768E" stroke-width="5" stroke-dasharray="14 12"/>
    <line x1="150" y1="330" x2="150" y2="240" stroke="#A78BFA" stroke-width="4" stroke-dasharray="18 14"/>
    <line x1="362" y1="330" x2="362" y2="240" stroke="#A78BFA" stroke-width="4" stroke-dasharray="18 14"/>
    <line x1="120" y1="290" x2="120" y2="210" stroke="#7AA2F7" stroke-width="3" stroke-dasharray="12 12"/>
    <line x1="392" y1="290" x2="392" y2="210" stroke="#7AA2F7" stroke-width="3" stroke-dasharray="12 12"/>
  </g>

  <!-- Pulsing Orbit Rings -->
  <ellipse cx="256" cy="210" rx="135" ry="52" fill="none" stroke="url(#arrowGrad)" stroke-width="3.5" opacity="0.6" stroke-dasharray="14 10" filter="url(#intenseGlow)"/>
  <ellipse cx="256" cy="210" rx="160" ry="62" fill="none" stroke="#7DCFFF" stroke-width="2" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Symmetrical Arrow Projectile Core -->
  <g filter="url(#intenseGlow)">
    <!-- Shaft Glow -->
    <line x1="256" y1="345" x2="256" y2="125" stroke="url(#arrowGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- Shaft Center Core -->
    <line x1="256" y1="345" x2="256" y2="125" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

    <!-- Aerodynamic Arrowhead (Top) -->
    <polygon points="256,65 205,145 235,140 256,120 277,140 307,145" fill="url(#arrowGrad)"/>
    <polygon points="256,75 220,135 242,132 256,118 270,132 292,135" fill="#FFFFFF"/>
    <polygon points="256,85 240,125 256,110 272,125" fill="#7DCFFF"/>

    <!-- Fletching (Tail Wings) -->
    <!-- Left Wing -->
    <polygon points="256,335 180,365 210,315 256,305" fill="#A78BFA"/>
    <polygon points="256,325 195,350 220,315" fill="#F7768E"/>
    <!-- Right Wing -->
    <polygon points="256,335 332,365 302,315 256,305" fill="#A78BFA"/>
    <polygon points="256,325 317,350 292,315" fill="#F7768E"/>
  </g>

  <!-- Riding Saddle / High-Tech Throne (Middle of the Projectile) -->
  <g filter="url(#intenseGlow)">
    <!-- Throne Seat Base -->
    <path d="M 215 230 Q 256 242 297 230 L 290 252 Q 256 260 222 252 Z" fill="#BB9AF7" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Throne Winged Backrest -->
    <path d="M 220 230 C 200 195, 215 165, 240 180 C 235 200, 230 215, 225 230 Z" fill="#7AA2F7" stroke="#A78BFA" stroke-width="2"/>
    <path d="M 292 230 C 312 195, 297 165, 272 180 C 277 200, 282 215, 287 230 Z" fill="#7AA2F7" stroke="#A78BFA" stroke-width="2"/>
    <!-- Center Saddle Cushion -->
    <ellipse cx="256" cy="238" rx="26" ry="11" fill="url(#titleGrad)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Golden Crown of the Passenger (Mounted atop the seat) -->
  <g filter="url(#softGlow)">
    <path d="M 236 175 L 242 196 L 270 196 L 276 175 L 265 185 L 256 168 L 247 185 Z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Crown Jewels -->
    <circle cx="236" cy="172" r="3" fill="#FFEAA7"/>
    <circle cx="256" cy="165" r="3.5" fill="#FFFFFF"/>
    <circle cx="276" cy="172" r="3" fill="#FFEAA7"/>
    <circle cx="256" cy="188" r="2.5" fill="#F7768E"/>
  </g>

  <!-- Sparkles & Magic Stars -->
  <g filter="url(#softGlow)">
    <!-- Top-Right Star -->
    <path d="M 390 120 Q 390 135 405 135 Q 390 135 390 150 Q 390 135 375 135 Q 390 135 390 120 Z" fill="#7DCFFF"/>
    <!-- Top-Left Star -->
    <path d="M 122 135 Q 122 148 135 148 Q 122 148 122 161 Q 122 148 109 148 Q 122 148 122 135 Z" fill="#A78BFA"/>
    <!-- Side Star -->
    <path d="M 415 240 Q 415 250 425 250 Q 415 250 415 260 Q 415 250 405 250 Q 415 250 415 240 Z" fill="#9ECE6A"/>
    <path d="M 95 250 Q 95 260 105 260 Q 95 260 95 270 Q 95 260 85 260 Q 95 260 95 250 Z" fill="#FF9E64"/>
    <!-- Particle Dots -->
    <circle cx="340" cy="100" r="3" fill="#FFFFFF"/>
    <circle cx="170" cy="110" r="2.5" fill="#7DCFFF"/>
    <circle cx="370" cy="200" r="3" fill="#A78BFA"/>
    <circle cx="140" cy="205" r="3" fill="#BB9AF7"/>
  </g>

  <!-- Lower Title Plaque Banner -->
  <g>
    <!-- Shadow / Outer Glow Plaque -->
    <rect x="56" y="385" width="400" height="78" rx="24" ry="24" fill="#13141C" stroke="url(#borderGrad)" stroke-width="3" filter="url(#softGlow)"/>
    <rect x="62" y="391" width="388" height="66" rx="19" ry="19" fill="#1A1B26" opacity="0.9"/>

    <!-- Prominent, Clear, Bold Title -->
    <text x="256" y="428" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="4.5">ALWAYSSIT</text>

    <!-- Subtitle -->
    <text x="256" y="447" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="800" fill="#7AA2F7" text-anchor="middle" letter-spacing="5">PROJECTILE RIDING</text>
  </g>
</svg>
