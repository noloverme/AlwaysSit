<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#232438"/>
      <stop offset="60%" stop-color="#16161E"/>
      <stop offset="100%" stop-color="#0E0E14"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Projectile Energy Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7768E"/>
      <stop offset="40%" stop-color="#A78BFA"/>
      <stop offset="80%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Saddle / Seat Gradient -->
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#7AA2F7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Speed Motion Trails -->
  <g opacity="0.4" stroke-linecap="round">
    <line x1="80" y1="410" x2="170" y2="340" stroke="#F7768E" stroke-width="5" stroke-dasharray="16 12"/>
    <line x1="110" y1="450" x2="210" y2="370" stroke="#A78BFA" stroke-width="6" stroke-dasharray="24 16"/>
    <line x1="60" y1="360" x2="140" y2="300" stroke="#7AA2F7" stroke-width="4" stroke-dasharray="12 14"/>
    <line x1="150" y1="460" x2="230" y2="400" stroke="#7DCFFF" stroke-width="4" stroke-dasharray="18 14"/>
  </g>

  <!-- Flight Aura Rings -->
  <ellipse cx="240" cy="272" rx="100" ry="46" transform="rotate(-40 240 272)" fill="none" stroke="url(#energyGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="12 8" filter="url(#softGlow)"/>
  <ellipse cx="270" cy="242" rx="130" ry="56" transform="rotate(-40 270 242)" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Flying Arrow / Projectile Body -->
  <g transform="translate(0, 0)">
    <!-- Trail Glow -->
    <path d="M 120 392 L 350 162" stroke="url(#energyGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
    <!-- Solid Shaft -->
    <path d="M 120 392 L 350 162" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

    <!-- Arrow Fletching (Tail Wings) -->
    <path d="M 115 397 L 75 415 L 105 365 Z" fill="#F7768E" filter="url(#softGlow)"/>
    <path d="M 125 387 L 145 437 L 175 407 Z" fill="#A78BFA" filter="url(#softGlow)"/>
    <path d="M 110 402 L 70 435 L 100 440 Z" fill="#7AA2F7" opacity="0.8"/>

    <!-- Arrowhead -->
    <polygon points="395,117 335,145 350,175 380,160" fill="url(#energyGrad)" filter="url(#glow)"/>
    <polygon points="395,117 342,150 362,170" fill="#FFFFFF"/>
    <polygon points="395,117 365,130 380,145" fill="#7DCFFF"/>
  </g>

  <!-- Throne / Saddle Riding Seat -->
  <g filter="url(#glow)">
    <!-- Saddle Base on the projectile -->
    <path d="M 205 285 C 215 255, 265 225, 290 230 C 295 245, 275 275, 240 295 Z" fill="url(#seatGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Saddle Backrest (Winged Throne) -->
    <path d="M 210 275 C 190 250, 205 210, 235 225 C 230 245, 220 265, 210 275 Z" fill="#BB9AF7" stroke="#7AA2F7" stroke-width="2"/>
    <!-- Stirrup / Energy Arc -->
    <path d="M 235 280 Q 245 320 260 310" fill="none" stroke="#7DCFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="312" r="5" fill="#FFFFFF" filter="url(#softGlow)"/>
  </g>

  <!-- Crown / Player Silhouette Emblem on the Seat -->
  <g transform="translate(225, 175)" filter="url(#softGlow)">
    <!-- Mini Crown of flight mastery -->
    <path d="M 15 25 L 20 40 L 40 40 L 45 25 L 34 32 L 30 18 L 26 32 Z" fill="#FF9E64" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="20" cy="23" r="2.5" fill="#FFEAA7"/>
    <circle cx="30" cy="16" r="2.5" fill="#FFEAA7"/>
    <circle cx="40" cy="23" r="2.5" fill="#FFEAA7"/>
  </g>

  <!-- Sparkles & Particles -->
  <g fill="#FFFFFF" filter="url(#softGlow)">
    <!-- Star 1 -->
    <path d="M 390 195 Q 390 205 400 205 Q 390 205 390 215 Q 390 205 380 205 Q 390 205 390 195 Z" fill="#7DCFFF"/>
    <!-- Star 2 -->
    <path d="M 150 150 Q 150 162 162 162 Q 150 162 150 174 Q 150 162 138 162 Q 150 162 150 150 Z" fill="#A78BFA"/>
    <!-- Star 3 -->
    <path d="M 320 350 Q 320 360 330 360 Q 320 360 320 370 Q 320 360 310 360 Q 320 360 320 350 Z" fill="#9ECE6A"/>
    <!-- Small dots -->
    <circle cx="370" cy="140" r="3" fill="#7DCFFF"/>
    <circle cx="170" cy="270" r="3" fill="#BB9AF7"/>
    <circle cx="280" cy="130" r="2.5" fill="#FFFFFF"/>
    <circle cx="430" cy="260" r="3.5" fill="#A78BFA"/>
    <circle cx="100" cy="230" r="2" fill="#7AA2F7"/>
  </g>

  <!-- Bottom Badge Label: ALWAYSSIT -->
  <g transform="translate(156, 420)">
    <rect x="0" y="0" width="200" height="34" rx="17" ry="17" fill="#1F202E" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="100" y="22" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14" font-weight="800" fill="#A78BFA" text-anchor="middle" letter-spacing="3">ALWAYS SIT</text>
  </g>
</svg>
