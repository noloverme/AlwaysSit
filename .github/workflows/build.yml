name: CI & Auto Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Auto Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Extract Project Version from pom.xml
        id: get_version
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected project version: $VERSION (Tag: v$VERSION)"

      - name: Check if Version Tag Already Exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists in git history. Skipping GitHub Release creation."
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $TAG does not exist yet. Will create GitHub Release!"
          fi

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Upload Build Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysSit-${{ steps.get_version.outputs.version }}
          path: target/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.is_new_version == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: AlwaysSit v${{ steps.get_version.outputs.version }}
          files: target/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
